services:
  - type: web
    name: phishguard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 90 --bind 0.0.0.0:$PORT server:app
    healthCheckPath: /api/status
    envVars:
      - key: URLSCAN_API_KEY
        sync: false
